<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedIntel Chatbot</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <h2>MedIntel - Medical Chatbot</h2>
        <div id="chat-box"></div>
        <input type="text" id="user-input" placeholder="Ask a medical question...">
        <button id="send-btn">Send</button>
    </div>

    <script>
        $(document).ready(function() {
            $("#send-btn").click(function() {
                var userMessage = $("#user-input").val();
                $("#chat-box").append("<p><strong>You:</strong> " + userMessage + "</p>");
                $("#user-input").val("");

                $.post("/get", { msg: userMessage }, function(data) {
                    $("#chat-box").append("<p><strong>MedIntel:</strong> " + data.response + "</p>");
                });
            });
        });
    </script>
</body>
</html>
